<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Illustration: top-down store view with occupancy heatmap, a checkout queue and a line-crossing counter">
  <defs>
    <radialGradient id="h1"><stop offset="0" stop-color="#ff453a" stop-opacity=".85"/><stop offset="1" stop-color="#ff453a" stop-opacity="0"/></radialGradient>
    <radialGradient id="h2"><stop offset="0" stop-color="#ff9f0a" stop-opacity=".7"/><stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/></radialGradient>
    <radialGradient id="h3"><stop offset="0" stop-color="#30d158" stop-opacity=".6"/><stop offset="1" stop-color="#30d158" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tt{font:600 15px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f5f5f7}
    .ss{font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#a1a1a6}
    .m{font:700 11px ui-monospace,Menlo,Consolas,monospace}
    .shelf{fill:#1b2233;stroke:#2a3142;stroke-width:1.5}
    .dot{fill:#30d158}
    .heat{animation:hp 4s ease-in-out infinite alternate}
    @keyframes hp{from{opacity:.55}to{opacity:1}}
    .q{animation:qm 3.5s ease-in-out infinite alternate}
    @keyframes qm{to{transform:translateX(8px)}}
  </style>
  <rect width="560" height="360" rx="22" fill="#0b0f19"/>
  <text class="tt" x="24" y="34">Retail analytics</text>
  <text class="ss" x="24" y="54">Occupancy · queues · shelf and crowd heatmaps</text>

  <g transform="translate(24,72)">
    <rect width="512" height="264" rx="12" fill="#101623" stroke="#2a3142" stroke-width="1.5"/>
    <!-- shelves -->
    <rect class="shelf" x="40" y="30" width="150" height="26" rx="6"/>
    <rect class="shelf" x="40" y="90" width="150" height="26" rx="6"/>
    <rect class="shelf" x="40" y="150" width="150" height="26" rx="6"/>
    <rect class="shelf" x="230" y="30" width="26" height="146" rx="6"/>
    <!-- heat -->
    <g class="heat">
      <circle cx="120" cy="73" r="64" fill="url(#h2)"/>
      <circle cx="243" cy="118" r="52" fill="url(#h3)"/>
      <circle cx="400" cy="190" r="74" fill="url(#h1)"/>
    </g>
    <!-- checkout + queue -->
    <rect class="shelf" x="372" y="214" width="116" height="26" rx="6"/>
    <g class="q">
      <rect x="338" y="168" width="22" height="44" rx="3" fill="none" stroke="#30d158" stroke-width="2"/>
      <rect x="372" y="150" width="22" height="44" rx="3" fill="none" stroke="#30d158" stroke-width="2"/>
      <rect x="406" y="134" width="22" height="44" rx="3" fill="none" stroke="#30d158" stroke-width="2"/>
    </g>
    <rect x="334" y="120" width="86" height="16" rx="4" fill="#30d158"/><text class="m" x="377" y="132" text-anchor="middle" fill="#000">queue: 3</text>
    <!-- entrance line crossing -->
    <path d="M20 232H110" stroke="#0a84ff" stroke-width="3" stroke-dasharray="7 6"/>
    <rect x="20" y="204" width="90" height="16" rx="4" fill="#0a84ff"/><text class="m" x="65" y="216" text-anchor="middle" fill="#000">entrance</text>
    <circle class="dot" cx="64" cy="244" r="5"/><circle class="dot" cx="84" cy="250" r="5" opacity=".6"/>
  </g>
</svg>
