<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-label="Illustration: four camera feeds with person detections and identities carried across cameras">
  <style>
    .m{font:700 11px ui-monospace,Menlo,Consolas,monospace}
    .tt{font:600 15px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#f5f5f7}
    .ss{font:12px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#a1a1a6}
    .tile{fill:#141a26;stroke:#2a3142;stroke-width:1.5}
    .bx{fill:none;stroke:#30d158;stroke-width:2}
    .bx2{fill:none;stroke:#0a84ff;stroke-width:2}
    .tg{fill:#30d158}.tg2{fill:#0a84ff}
    .rec{fill:#ff453a;animation:b 1.4s steps(2,jump-none) infinite}
    @keyframes b{50%{opacity:.15}}
    .scan{fill:#30d158;opacity:.18;animation:s 3.2s linear infinite}
    @keyframes s{0%{transform:translateY(-4px)}100%{transform:translateY(96px)}}
    .walk{animation:w 5s ease-in-out infinite alternate}
    @keyframes w{to{transform:translateX(22px)}}
  </style>
  <rect width="560" height="360" rx="22" fill="#0b0f19"/>
  <text class="tt" x="24" y="34">Multi-camera identity tracking</text>
  <text class="ss" x="24" y="54">One person, one ID, across every camera</text>

  <!-- CAM 1 -->
  <g transform="translate(24,72)">
    <rect class="tile" width="248" height="130" rx="10"/>
    <g clip-path="url(#c1)"><rect class="scan" y="0" width="248" height="22"/></g>
    <clipPath id="c1"><rect width="248" height="130" rx="10"/></clipPath>
    <g class="walk"><rect class="bx" x="60" y="34" width="38" height="78" rx="4"/><rect class="tg" x="60" y="20" width="34" height="14" rx="3"/><text class="m" x="77" y="31" text-anchor="middle" fill="#000">ID 1</text></g>
    <rect class="bx2" x="160" y="46" width="34" height="66" rx="4"/><rect class="tg2" x="160" y="32" width="34" height="14" rx="3"/><text class="m" x="177" y="43" text-anchor="middle" fill="#000">ID 2</text>
    <circle class="rec" cx="16" cy="16" r="4"/><text class="m" x="26" y="20" fill="#a1a1a6">CAM 1</text>
  </g>
  <!-- CAM 2 -->
  <g transform="translate(288,72)">
    <rect class="tile" width="248" height="130" rx="10"/>
    <rect class="bx" x="120" y="30" width="40" height="84" rx="4"/><rect class="tg" x="120" y="16" width="34" height="14" rx="3"/><text class="m" x="137" y="27" text-anchor="middle" fill="#000">ID 1</text>
    <circle class="rec" cx="16" cy="16" r="4"/><text class="m" x="26" y="20" fill="#a1a1a6">CAM 2</text>
  </g>
  <!-- CAM 3 -->
  <g transform="translate(24,218)">
    <rect class="tile" width="248" height="118" rx="10"/>
    <g class="walk"><rect class="bx2" x="84" y="26" width="36" height="74" rx="4"/><rect class="tg2" x="84" y="12" width="34" height="14" rx="3"/><text class="m" x="101" y="23" text-anchor="middle" fill="#000">ID 2</text></g>
    <rect class="bx" x="150" y="34" width="36" height="66" rx="4"/><rect class="tg" x="150" y="20" width="34" height="14" rx="3"/><text class="m" x="167" y="31" text-anchor="middle" fill="#000">ID 1</text>
    <circle class="rec" cx="16" cy="16" r="4"/><text class="m" x="26" y="20" fill="#a1a1a6">CAM 3</text>
  </g>
  <!-- CAM 4 -->
  <g transform="translate(288,218)">
    <rect class="tile" width="248" height="118" rx="10"/>
    <rect class="bx2" x="96" y="30" width="36" height="70" rx="4"/><rect class="tg2" x="96" y="16" width="34" height="14" rx="3"/><text class="m" x="113" y="27" text-anchor="middle" fill="#000">ID 2</text>
    <circle class="rec" cx="16" cy="16" r="4"/><text class="m" x="26" y="20" fill="#a1a1a6">CAM 4</text>
  </g>
</svg>
