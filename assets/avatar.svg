<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Illustrated avatar of Debdeep Sanyal inside a green detection box">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#d8dde6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- shoulders + shirt -->
  <path d="M70 512C70 408 150 362 256 362s186 46 186 150z" fill="url(#shirt)"/>
  <!-- neck -->
  <path d="M222 318h68v58c0 14-16 26-34 26s-34-12-34-26z" fill="#c48d69"/>
  <path d="M222 352c10 14 22 20 34 20s24-6 34-20v-18H222z" fill="#b77f5c" opacity=".55"/>
  <!-- collar -->
  <path d="M212 366l44 56-6 18-58-48z" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
  <path d="M300 366l-44 56 6 18 58-48z" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
  <!-- lanyard + badge -->
  <path d="M222 380L246 512" stroke="#2f52e0" stroke-width="14" stroke-linecap="round"/>
  <path d="M290 380L266 512" stroke="#2f52e0" stroke-width="14" stroke-linecap="round"/>
  <rect x="236" y="470" width="40" height="42" rx="5" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
  <rect x="244" y="478" width="24" height="8" rx="2" fill="#2f52e0"/>

  <!-- ears -->
  <ellipse cx="176" cy="240" rx="13" ry="22" fill="#c48d69"/>
  <ellipse cx="336" cy="240" rx="13" ry="22" fill="#c48d69"/>
  <!-- head -->
  <ellipse cx="256" cy="232" rx="82" ry="96" fill="#d4a07b"/>
  <!-- hair -->
  <path d="M170 226C158 142 202 100 262 102c60 2 98 42 84 124-10-40-38-62-90-62-52 0-76 26-86 62z" fill="#1b1b24"/>
  <path d="M196 124c18-18 60-28 96-14-30-2-62 6-96 14z" fill="#2a2a36"/>
  <!-- brows -->
  <path d="M208 214c10-8 24-8 34-2" stroke="#1b1b24" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M270 212c10-6 24-6 34 2" stroke="#1b1b24" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- eyes -->
  <ellipse cx="225" cy="240" rx="8" ry="9" fill="#14141b"/>
  <ellipse cx="287" cy="240" rx="8" ry="9" fill="#14141b"/>
  <circle cx="228" cy="237" r="2.5" fill="#fff"/>
  <circle cx="290" cy="237" r="2.5" fill="#fff"/>
  <!-- nose -->
  <path d="M256 244c-2 18-8 32-10 38 6 4 14 4 20 0-2-6-8-20-10-38z" fill="#bf875f" opacity=".7"/>
  <!-- moustache -->
  <path d="M222 292c14-12 28-14 34-8 6-6 20-4 34 8-14 6-26 4-34-2-8 6-20 8-34 2z" fill="#26191d"/>
  <!-- mouth -->
  <path d="M242 312c8 5 20 5 28 0" stroke="#8a4a3c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- detection box: the signature -->
  <g fill="none" stroke="#30d158" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 140V110a14 14 0 0 1 14-14h30"/>
    <path d="M318 96h30a14 14 0 0 1 14 14v30"/>
    <path d="M362 330v30a14 14 0 0 1-14 14h-30"/>
    <path d="M194 374h-30a14 14 0 0 1-14-14v-30"/>
  </g>
  <rect x="150" y="62" width="74" height="28" rx="8" fill="#30d158"/>
  <text x="187" y="82" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#000">ID 1</text>
</svg>
